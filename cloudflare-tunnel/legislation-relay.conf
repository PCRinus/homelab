server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    access_log /var/log/nginx/access.log main;

    # A literal upstream host is resolved once at startup; a variable plus
    # Docker's embedded DNS re-resolves when the portal's address changes.
    resolver 127.0.0.11 valid=300s ipv6=off;
    set $portal legislatie.just.ro;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass https://$portal;
        proxy_http_version 1.1;
        proxy_set_header Host legislatie.just.ro;
        proxy_set_header Connection "";

        proxy_ssl_server_name on;
        proxy_ssl_name legislatie.just.ro;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        # The caller reads the portal's own redirects.
        proxy_redirect off;

        proxy_set_header CF-Access-Client-Id "";
        proxy_set_header CF-Access-Client-Secret "";
        proxy_set_header Cf-Access-Jwt-Assertion "";

        # The portal refuses datacenter networks; these would tell it the
        # request came through Cloudflare from one.
        proxy_set_header Cf-Connecting-Ip "";
        proxy_set_header Cf-Ipcountry "";
        proxy_set_header Cf-Ray "";
        proxy_set_header Cf-Visitor "";
        proxy_set_header Cf-Warp-Tag-Id "";
        proxy_set_header Cf-Worker "";
        proxy_set_header Cdn-Loop "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-Ip "";

        proxy_connect_timeout 35s;
        proxy_send_timeout 35s;
        proxy_read_timeout 35s;

        proxy_buffering on;
        proxy_buffer_size 32k;
        proxy_buffers 32 16k;
        proxy_busy_buffers_size 64k;
    }
}
