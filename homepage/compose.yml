# Each service gets only the variables it reads. Bare names are filled in by
# Compose from the decrypted .env that homelab_compose passes with --env-file
# (scripts/lib/compose-env.sh); a name missing there is left out, not set empty.
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.7
    container_name: homepage
    restart: unless-stopped
    environment:
      - PUID
      - TZ
      - HOMEPAGE_ALLOWED_HOSTS
      # {{HOMEPAGE_VAR_*}} placeholders used in services.yaml / widgets.yaml
      - HOMEPAGE_VAR_SERVER_HOSTNAME
      - HOMEPAGE_VAR_SONARR_API_KEY
      - HOMEPAGE_VAR_SONARR_ANIME_API_KEY
      - HOMEPAGE_VAR_RADARR_API_KEY
      - HOMEPAGE_VAR_PROWLARR_API_KEY
      - HOMEPAGE_VAR_BAZARR_API_KEY
      - HOMEPAGE_VAR_TAUTULLI_API_KEY
      - HOMEPAGE_VAR_QBITTORRENT_USER
      - HOMEPAGE_VAR_QBITTORRENT_PASS
      - HOMEPAGE_VAR_PLEX_TOKEN
      - HOMEPAGE_VAR_ADGUARD_USER
      - HOMEPAGE_VAR_ADGUARD_PASS
      - HOMEPAGE_VAR_PANGOLIN_API_KEY
      - PGID
    ports:
      - 3000:3000
    volumes:
      # Versioned configs - read-only
      - ./services.yaml:/app/config/services.yaml:ro
      - ./settings.yaml:/app/config/settings.yaml:ro
      - ./bookmarks.yaml:/app/config/bookmarks.yaml:ro
      - ./docker.yaml:/app/config/docker.yaml:ro
      - ./widgets.yaml:/app/config/widgets.yaml:ro
      - ./custom.css:/app/config/custom.css:ro
      - ./custom.js:/app/config/custom.js:ro
      - ./kubernetes.yaml:/app/config/kubernetes.yaml:ro
      - ./proxmox.yaml:/app/config/proxmox.yaml:ro
      # Container-writable data - not versioned
      - ${DOCKER_DATA}/homepage/logs:/app/config/logs
      # Other mounts (Docker is reached through homepage-docker-proxy, see docker.yaml)
      - ${MEDIA_PATH}:/mnt/unas/media:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "plex:host-gateway" # Plex runs with host networking, so the Docker DNS name `plex` doesn't exist
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - media-net
      - docker-proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Read-only Docker API for Homepage's container status and stats, so Homepage
  # itself has no Docker socket. GET only (POST=0 is the image default);
  # CONTAINERS covers list/inspect/stats, and EVENTS is not needed.
  # It is not harmless: any GET under /containers is allowed, so whatever
  # reaches this proxy can read every container's environment (inspect) and
  # files (archive/export). It only removes the ability to change anything.
  homepage-docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: homepage-docker-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - EVENTS=0
    volumes:
      - ${DOCKER_SOCK}:/var/run/docker.sock:ro
    networks:
      - docker-proxy

networks:
  media-net:
    external: true # Defined in media-server/compose.yml
  docker-proxy:
    internal: true # Only Homepage reaches the proxy; anything that can reads every container's config
