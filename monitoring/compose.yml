# Each service gets only the variables it reads. Bare names are filled in by
# Compose from the decrypted .env that homelab_compose passes with --env-file
# (scripts/lib/compose-env.sh); a name missing there is left out, not set empty.
services:
  dozzle:
    container_name: dozzle
    image: ghcr.io/amir20/dozzle:v11.4.0
    environment:
      DOZZLE_REMOTE_AGENT: ${DOZZLE_REMOTE_AGENT:-}
    # Dozzle keeps the raw socket. tecnativa/docker-socket-proxy cuts any
    # response after 10 minutes without data, which ends the log stream of a
    # quiet container, and Dozzle does not reopen it: the page looks live but
    # shows nothing new. Dozzle is only reachable from the LAN and behind
    # Cloudflare Access.
    volumes:
      - ${DOCKER_SOCK}:/var/run/docker.sock
    ports:
      - 8081:8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  gatus:
    image: ghcr.io/twin/gatus:v5.38.0
    container_name: gatus
    ports:
      - 8082:8080
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ${DOCKER_DATA}/gatus/data:/data
    environment:
      - TZ
      # Variables referenced in config.yaml
      - GATUS_DISCORD_WEBHOOK_URL
      - GATUS_DISCORD_LINK_SPEED_MENTION
      - SONARR_API_KEY
      - SONARR_ANIME_API_KEY
      - RADARR_API_KEY
      - PROWLARR_API_KEY
      - BAZARR_API_KEY
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "plex:host-gateway" # Plex runs with host networking, so the Docker DNS name `plex` doesn't exist
    networks:
      - default
      - media-net
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "dozzle.enable=true"

  vps-memory-proxy:
    image: alpine/socat:1.8.1.3
    container_name: vps-memory-proxy
    command:
      - "TCP-LISTEN:18888,fork,reuseaddr"
      - "TCP:${VPS_TAILSCALE_IP}:8888"
    network_mode: host
    restart: unless-stopped
    labels:
      - "dozzle.enable=true"

  # Exposes host NIC link speed as HTTP endpoint for Gatus monitoring
  # Alerts if link drops below GbE (e.g., cable issue causing auto-negotiation to FE)
  link-speed-monitor:
    image: busybox:1.38
    container_name: link-speed-monitor
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /www/cgi-bin
        cat > /www/cgi-bin/speed <<'SCRIPT'
        #!/bin/sh
        SPEED=$$(cat /host-net-speed 2>/dev/null || echo "0")
        printf 'Content-Type: application/json\r\n\r\n'
        printf '{"speed":%s,"unit":"Mbps"}' "$$SPEED"
        SCRIPT
        chmod +x /www/cgi-bin/speed
        exec httpd -f -p 8888 -h /www
    volumes:
      - /sys/class/net/enp46s0/speed:/host-net-speed:ro
    networks:
      - media-net
    restart: unless-stopped
    labels:
      - "dozzle.enable=true"

  # Plex playback watchdog: follows Plex Media Server.log and posts to Discord
  # on client stalls, transcoder errors, GPU -> software transcode fallback and
  # NIC link drops, with NIC / qBittorrent / Plex-session context attached.
  # Also prints a metrics line every 30 s during playback (Dozzle history).
  # Check detection against an archived day:
  #   docker compose run --rm stream-watchdog --replay /archive/plex-media-server-YYYY-MM-DD.log.gz
  stream-watchdog:
    image: python:3.14.10-alpine3.24
    container_name: stream-watchdog
    init: true
    entrypoint: ["python3", "-u", "/app/watchdog.py"]
    environment:
      - TZ
      # Variables watchdog.py reads (unset ones are left out)
      - PLEX_TOKEN
      - QBITTORRENT_USER
      - QBITTORRENT_PASS
      - STREAM_WATCHDOG_DISCORD_WEBHOOK_URL
      - STREAM_WATCHDOG_DISCORD_MENTION
      - GATUS_DISCORD_WEBHOOK_URL
      - DISCORD_WEBHOOK_URL
      - NIC_NAME=enp46s0
    volumes:
      - ./stream-watchdog/watchdog.py:/app/watchdog.py:ro
      - type: bind
        source: "${DOCKER_DATA}/plex/config/Library/Application Support/Plex Media Server/Logs"
        target: /plex-logs
        read_only: true
      - ${DOCKER_DATA}/plex/log-archive:/archive:ro
      - /sys/class/net/enp46s0:/host-nic:ro
    networks:
      - media-net
    extra_hosts:
      - "plex:host-gateway" # Plex runs with host networking, so the Docker DNS name `plex` doesn't exist
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "10"
    labels:
      - "dozzle.enable=true"

networks:
  media-net:
    external: true
