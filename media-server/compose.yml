services:
  qbittorrent:
    image: ghcr.io/hotio/qbittorrent:release-5.2.4
    container_name: qbittorrent
    hostname: qbittorrent.internal
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=1
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - ${HOMELAB_RUNTIME_ENV_FILE:-../.env}
    environment:
      - WEBUI_PORTS=8080/tcp,8080/udp
      - VPN_ENABLED=true
      - VPN_CONF=wg0
      - VPN_PROVIDER=proton
      - VPN_LAN_NETWORK=192.168.1.0/24,100.64.0.0/10 # LAN + Tailscale CGNAT range
      - VPN_AUTO_PORT_FORWARD=true
      - VPN_HEALTHCHECK_ENABLED=true
    volumes:
      - ${DOCKER_DATA}/qbittorrent:/config
      - ${MEDIA_PATH}:/data
      - ${QBITTORRENT_INCOMPLETE_PATH}:/data/incomplete
    ports:
      - "8080:8080" # qBittorrent WebUI
    networks:
      - media-net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:8080 > /dev/null && curl -sf --max-time 10 https://ifconfig.me > /dev/null || exit 1",
        ]
      interval: 2m
      timeout: 15s
      retries: 3
      start_period: 1m

  sonarr:
    image: ghcr.io/hotio/sonarr:release-4.0.20.3014
    container_name: sonarr
    env_file:
      - ${HOMELAB_RUNTIME_ENV_FILE:-../.env}
    volumes:
      - ${DOCKER_DATA}/sonarr:/config
      - ${MEDIA_PATH}:/data
    ports:
      - "8989:8989"
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
    networks:
      - media-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  sonarr-anime:
    image: ghcr.io/hotio/sonarr:release-4.0.20.3014
    container_name: sonarr-anime
    env_file:
      - ${HOMELAB_RUNTIME_ENV_FILE:-../.env}
    volumes:
      - ${DOCKER_DATA}/sonarr-anime:/config
      - ${MEDIA_PATH}:/data
    ports:
      - "8990:8989"
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
    networks:
      - media-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  radarr:
    image: ghcr.io/hotio/radarr:release-6.4.4.10685
    container_name: radarr
    env_file:
      - ${HOMELAB_RUNTIME_ENV_FILE:-../.env}
    volumes:
      - ${DOCKER_DATA}/radarr:/config
      - ${MEDIA_PATH}:/data
    ports:
      - "7878:7878"
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
    networks:
      - media-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  prowlarr:
    image: ghcr.io/hotio/prowlarr:release-2.6.5.5623
    container_name: prowlarr
    env_file:
      - ${HOMELAB_RUNTIME_ENV_FILE:-../.env}
    environment:
      - UMASK=002
    volumes:
      - ${DOCKER_DATA}/prowlarr:/config
    ports:
      - "9696:9696"
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
    networks:
      - media-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: flaresolverr
    env_file:
      - ${HOMELAB_RUNTIME_ENV_FILE:-../.env}
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
    ports:
      - "8191:8191"
    networks:
      - media-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  pulsarr:
    image: lakker/pulsarr:0.19.4
    container_name: pulsarr
    env_file:
      - ${HOMELAB_RUNTIME_ENV_FILE:-../.env}
    environment:
      - baseUrl=http://pulsarr
      - port=3003
      - listenPort=3003
      - dbPath=./data/db/pulsarr.db
      - cookieSecured=false
      - logLevel=info
      - enableConsoleOutput=true
    ports:
      - "3003:3003"
    volumes:
      - ${DOCKER_DATA}/pulsarr:/app/data
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
    networks:
      - media-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/docker-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  plex:
    image: lscr.io/linuxserver/plex:1.43.4
    container_name: plex
    env_file:
      - ${HOMELAB_RUNTIME_ENV_FILE:-../.env}
    environment:
      - VERSION=docker
    devices:
      - /dev/dri:/dev/dri # GPU for VA-API hardware acceleration
    device_cgroup_rules:
      - "c 226:* rwm" # Allow access to DRI devices (no-op on rootful, required for rootless)
    group_add:
      - "${RENDER_GID}" # render group GID for GPU access
    volumes:
      - ${DOCKER_DATA}/plex/config:/config
      - ${MEDIA_PATH}:/data
    ports:
      - "32400:32400" # Plex Web UI (required)
      - "32410:32410/udp" # GDM network discovery
      - "32412:32412/udp" # GDM network discovery
      - "32413:32413/udp" # GDM network discovery
      - "32414:32414/udp" # GDM network discovery
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
    networks:
      - media-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:32400/identity"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  bazarr:
    image: ghcr.io/hotio/bazarr:release-1.6.2
    container_name: bazarr
    env_file:
      - ${HOMELAB_RUNTIME_ENV_FILE:-../.env}
    volumes:
      - ${DOCKER_DATA}/bazarr:/config
      - ${MEDIA_PATH}:/data
    ports:
      - "6767:6767"
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
    networks:
      - media-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6767/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  tautulli:
    image: lscr.io/linuxserver/tautulli:2.18.2
    container_name: tautulli
    env_file:
      - ${HOMELAB_RUNTIME_ENV_FILE:-../.env}
    volumes:
      - ${DOCKER_DATA}/tautulli:/config
      - type: bind
        source: "${DOCKER_DATA}/plex/config/Library/Application Support/Plex Media Server/Logs"
        target: /plex-logs
        read_only: true
    ports:
      - "8181:8181"
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
    networks:
      - media-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Plex Media Server.log for Dozzle, plus a 30-day archive on disk. Plex keeps
  # a fixed 6 x 10 MB rotation (under a day with verbose logging), so this
  # follows the live log into one file per UTC day (gzipped hourly once past)
  # and also prints each line, so Docker's log store gives Dozzle ~30 days.
  # On a fresh container (recreated after an image/config change) the archive
  # is replayed first so Dozzle history survives; replayed lines carry the
  # replay time as their Docker timestamp, but keep Plex's own timestamp text.
  plex-log-media-server:
    image: alpine:3.24
    container_name: plex-log-media-server
    init: true # Forward SIGTERM so `docker stop` doesn't wait for the kill timeout
    environment:
      - RETENTION_DAYS=30
    command:
      - /bin/sh
      - -c
      - |
        [ -p /tmp/live ] || mkfifo /tmp/live
        while true; do
          find /archive -name 'plex-media-server-*.log' ! -name "plex-media-server-$$(date -u +%F).log" -mmin +10 -exec gzip -f {} \;
          find /archive -name 'plex-media-server-*.log.gz' -mtime +"$$RETENTION_DAYS" -delete
          sleep 3600
        done &
        tail -n 0 -F "/plex-logs/Plex Media Server.log" 2>/dev/null | awk '{
          day = strftime("%Y-%m-%d")
          if (day != current) { if (current != "") close(out); current = day; out = "/archive/plex-media-server-" day ".log" }
          print >> out; fflush(out)
          print > "/tmp/live"; fflush("/tmp/live")
        }' &
        if [ ! -e /tmp/.replayed ]; then
          for f in $$(ls /archive/plex-media-server-*.log* 2>/dev/null | sort); do
            case "$$f" in *.gz) zcat "$$f" ;; *) cat "$$f" ;; esac
          done
          touch /tmp/.replayed
        fi
        exec cat /tmp/live
    volumes:
      - type: bind
        source: "${DOCKER_DATA}/plex/config/Library/Application Support/Plex Media Server/Logs"
        target: /plex-logs
        read_only: true
      - ${DOCKER_DATA}/plex/log-archive:/archive
    network_mode: none
    restart: unless-stopped
    logging:
      driver: local # Compresses rotated files; 40 x 100 MB covers 30+ days of verbose logs
      options:
        max-size: 100m
        max-file: "40"
    labels:
      - "dozzle.enable=true"

  plex-log-transcoder-statistics:
    image: alpine:3.24
    container_name: plex-log-transcoder-statistics
    command:
      - /bin/sh
      - -c
      - tail -n 0 -F /plex-logs/Plex\ Transcoder\ Statistics.log /plex-logs/Plex\ Transcoder\ Statistics.[1-5].log
    volumes:
      - type: bind
        source: "${DOCKER_DATA}/plex/config/Library/Application Support/Plex Media Server/Logs"
        target: /plex-logs
        read_only: true
    networks:
      - media-net
    restart: unless-stopped
    labels:
      - "dozzle.enable=true"

  plex-log-scanner-matcher:
    image: alpine:3.24
    container_name: plex-log-scanner-matcher
    command:
      - /bin/sh
      - -c
      - tail -n 0 -F /plex-logs/Plex\ Media\ Scanner\ Matcher.log /plex-logs/Plex\ Media\ Scanner\ Matcher.[1-5].log
    volumes:
      - type: bind
        source: "${DOCKER_DATA}/plex/config/Library/Application Support/Plex Media Server/Logs"
        target: /plex-logs
        read_only: true
    networks:
      - media-net
    restart: unless-stopped
    labels:
      - "dozzle.enable=true"

  # Quality profile and custom format management via TRaSH-Guides
  # Run manually: docker compose run --rm configarr
  # Or scheduled via cron on host
  configarr:
    image: ghcr.io/raydak-labs/configarr:1.34.1
    container_name: configarr
    env_file:
      - ${HOMELAB_RUNTIME_ENV_FILE:-../.env}
    volumes:
      - ./configarr:/app/config:ro # Config files (config.yml, secrets.yml)
      - ${DOCKER_DATA}/configarr/repos:/app/repos # Cache for TRaSH-Guides/Recyclarr repos
    networks:
      - media-net
    # No restart policy - this is a one-shot job, not a daemon
    # Run manually or via cron: docker compose run --rm configarr

  # Pangolin Newt - WireGuard tunnel connector to VPS
  # Creates an outbound tunnel from this server to the Pangolin VPS,
  # enabling remote access to Plex (and other services) bypassing CGNAT
  newt:
    image: fosrl/newt:1.18.1
    container_name: newt
    env_file:
      - ${HOMELAB_RUNTIME_ENV_FILE:-../.env}
    networks:
      - media-net
    restart: unless-stopped

  checkrr:
    image: aetaric/checkrr:3.6.1
    container_name: checkrr
    volumes:
      - ./checkrr/checkrr.yaml:/etc/checkrr.yaml:ro
      - ${DOCKER_DATA}/checkrr/checkrr.db:/checkrr.db
      - ${MEDIA_PATH}:/data:ro
    ports:
      - "8585:8585" # checkrr web UI
    networks:
      - media-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8585/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  media-net:
    name: media-net # Named network allows other compose stacks (e.g., homepage) to join for inter-container communication
