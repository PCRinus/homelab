# Configarr Configuration
# Syncs quality profiles and custom formats from TRaSH-Guides to Sonarr/Radarr
# Documentation: https://configarr.de/docs/

# ============================================================================
# SONARR CONFIGURATION
# ============================================================================
sonarr:
  main:
    base_url: http://sonarr:8989
    api_key: !secret SONARR_API_KEY

    # Include TRaSH-Guides templates via Recyclarr format
    include:
      # Quality definitions for TV series
      - template: sonarr-quality-definition-series

      # WEB-1080p profile (good balance of quality and size)
      - template: sonarr-v4-quality-profile-web-1080p
      - template: sonarr-v4-custom-formats-web-1080p

      # WEB-2160p profile (4K content)
      - template: sonarr-v4-quality-profile-web-2160p
      - template: sonarr-v4-custom-formats-web-2160p

    # Default profile for new shows: WEB-1080p's custom formats, but also accepting
    # HDTV/Bluray (older shows often have no WEB release) with a 720p fallback.
    cloneQualityProfiles:
      - from: WEB-1080p
        to: HD-1080p (TRaSH)

    quality_profiles:
      - name: HD-1080p (TRaSH)
        upgrade:
          allowed: true
          until_quality: 1080p
          until_score: 10000
        qualities:
          - name: 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
              - Bluray-1080p
              - HDTV-1080p
          - name: 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
              - Bluray-720p
              - HDTV-720p

    # Local custom formats for known-bad release names
    customFormatDefinitions:
      # The 2026 Grand Tour relaunch is released as "The Grand Tour 2026 S01", but
      # TVDB files it as S07 of The Grand Tour (2016). Indexers tag it with the
      # show's IMDb ID, so Sonarr grabs it when searching for the original S01 and
      # then blocks the import ("matched to series by ID").
      - trash_id: homelab-grand-tour-2026-relaunch
        trash_scores:
          default: -10000
        name: Grand Tour 2026 Relaunch
        includeCustomFormatWhenRenaming: false
        specifications:
          - name: Grand Tour 2026
            implementation: ReleaseTitleSpecification
            negate: false
            required: true
            fields:
              value: '\bThe[ ._-]?Grand[ ._-]?Tour[ ._-]?\(?2026\)?\b'

    custom_formats:
      - trash_ids:
          - homelab-grand-tour-2026-relaunch
        assign_scores_to:
          - name: WEB-1080p
          - name: WEB-2160p
          - name: HD-1080p (TRaSH)

  # Anime-dedicated Sonarr instance
  anime:
    base_url: http://sonarr-anime:8989
    api_key: !secret SONARR_ANIME_API_KEY

    include:
      # Anime-specific quality definitions (different file sizes from standard TV)
      - template: sonarr-quality-definition-anime

      # Anime quality profile and custom formats (Remux-1080p - Anime)
      - template: sonarr-v4-quality-profile-anime
      - template: sonarr-v4-custom-formats-anime

    # TRaSH requires 100 (a tiered release group). 1 also accepts untiered groups
    # as long as the release has a streaming-source or version tag.
    quality_profiles:
      - name: Remux-1080p - Anime
        min_format_score: 1

# ============================================================================
# RADARR CONFIGURATION
# ============================================================================
radarr:
  main:
    base_url: http://radarr:7878
    api_key: !secret RADARR_API_KEY

    # Include TRaSH-Guides templates via Recyclarr format
    include:
      # Quality definitions for movies
      - template: radarr-quality-definition-movie

      # HD Bluray + WEB profile (1080p - balanced quality)
      - template: radarr-quality-profile-hd-bluray-web
      - template: radarr-custom-formats-hd-bluray-web

      # UHD Bluray + WEB profile (4K content)
      - template: radarr-quality-profile-uhd-bluray-web
      - template: radarr-custom-formats-uhd-bluray-web

    # Blu-ray and WEB are merged into one quality per resolution (TRaSH ranks
    # Blu-ray above WEB). Radarr compares quality before custom format score, so
    # without the merge the DTS penalty below could never trade a DTS Blu-ray for
    # a DD+ WEB-DL. Without DTS, Blu-ray still wins on tier score (+100).
    # min_format_score -1000 (TRaSH: 0) lets a DTS-only movie still be grabbed.
    # Every other negative score in these profiles is -10000.
    quality_profiles:
      - name: HD Bluray + WEB
        min_format_score: -1000
        upgrade:
          allowed: true
          until_quality: Bluray + WEB 1080p
          until_score: 10000
        qualities:
          - name: Bluray + WEB 1080p
            qualities:
              - Bluray-1080p
              - WEBDL-1080p
              - WEBRip-1080p
          - name: Bluray-720p

      # Pulsarr's default profile: prefer 4K, but grab 1080p when no acceptable
      # 4K release exists and upgrade to 4K later.
      - name: UHD Bluray + WEB
        min_format_score: -1000
        upgrade:
          allowed: true
          until_quality: Bluray + WEB 2160p
          until_score: 10000
        qualities:
          - name: Bluray + WEB 2160p
            qualities:
              - Bluray-2160p
              - WEBDL-2160p
              - WEBRip-2160p
          - name: Bluray + WEB 1080p
            qualities:
              - Bluray-1080p
              - WEBDL-1080p
              - WEBRip-1080p

    # Prefer non-DTS audio. Plex for LG has no DTS support on the household's
    # newer LG TVs: every DTS play on the C4 and CX was transcoded, and a 4K HDR
    # transcode of a DTS file broke the Intel GPU decoder (2026-11-02). -1000
    # outweighs the tier spread (1600-1800), so any tiered non-DTS release beats
    # a tiered DTS one, while a DTS-only movie still passes min_format_score.
    # The five TRaSH DTS formats are mutually exclusive: a release scores -1000 once.
    custom_formats:
      - trash_ids:
          - 1c1a4c5e823891c75bc50380a6866f73 # DTS
          - f9f847ac70a0af62ea4a08280b859636 # DTS-ES
          - 8e109e50e0a0b83a5098b056e13bf6db # DTS-HD HRA
          - dcf3ec6938fa32445f590a4da84256cd # DTS-HD MA
          - 2f22d89048b01681dde8afe203bf2e95 # DTS X
        assign_scores_to:
          - name: HD Bluray + WEB
            score: -1000
          - name: UHD Bluray + WEB
            score: -1000
